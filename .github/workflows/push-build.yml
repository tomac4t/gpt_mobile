name: Push build APK

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE"
      - ".idea/**"
      - ".editorconfig"
      - "images/**"
      - "metadata/**"

permissions:
  contents: read

concurrency:
  group: push-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease

      - name: Generate Signing Key
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE }}
        run: echo "$KEYSTORE_B64" | base64 -d > keystore.jks
        working-directory: ${{ github.workspace }}/app/build/outputs/apk/release

      - name: Sign release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          apksigner sign \
            --ks keystore.jks \
            --alignment-preserved true \
            --ks-pass env:SIGNING_PASSWORD \
            --out app-release.apk \
            app-release-unsigned.apk
          apksigner verify --print-certs app-release.apk
          rm -f keystore.jks
        working-directory: ${{ github.workspace }}/app/build/outputs/apk/release

      - name: Create job summary
        run: |
          signed_hash=$(sha256sum ./apk/release/app-release.apk | awk '{print $1}')
          echo "### Push build results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Signed APK sha256**: \`$signed_hash\`" >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ github.workspace }}/app/build/outputs

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mobile-${{ github.sha }}
          path: ${{ github.workspace }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
